<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strona zabezpieczona – Design Review</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M10 9h12v9H15l-4 4z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/styles.css">
</head>
<body class="login-page">

<main class="login-wrap">
  <div class="login-box">
    <div class="card login-card">
      <a class="brand" href="/"><span class="brand-mark">😶‍🌫️</span><span>Design Review</span></a>
      <h1>Strona zabezpieczona</h1>
      <p class="muted">
        Projekt <b id="project-name">…</b> jest chroniony hasłem. Wpisz je, aby zobaczyć
        stronę i dodawać komentarze.
      </p>

      <form id="unlock-form" autocomplete="off">
        <label class="field">
          <span>Hasło</span>
          <div class="uid-row">
            <input id="password" type="password" name="password" placeholder="wpisz hasło"
                   autocomplete="current-password" spellcheck="false" autofocus>
            <button class="btn ghost" type="button" id="show-password" aria-pressed="false"
                    title="Pokaż / ukryj hasło">Pokaż</button>
          </div>
        </label>
        <p class="error" id="unlock-error" hidden></p>
        <button class="btn primary wide" type="submit" id="unlock-btn">Wejdź</button>
      </form>

      <p class="muted small">
        Hasło otrzymasz od autora projektu. Właściciel strony może zamiast tego
        <a id="login-link" href="/login">zalogować się uid-em</a> — wtedy hasło nie jest potrzebne.
      </p>
    </div>
  </div>
</main>

<script src="/unlock.js"></script>
</body>
</html>
